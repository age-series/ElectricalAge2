plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_common_denominator}"
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlin_common_denominator}"
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version "${mixingradle_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Enable the Jar-in-Jar system for your mod
jarJar.enable()

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            property 'terminal.ansi', 'true'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url 'https://jitpack.io'
    }

    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    maven {
        name "tterrag maven"
        url "https://maven.tterrag.com/"
    }

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven {
        url "https://maven.blamejared.com"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name "createmod maven"
        url "https://maven.createmod.net/"
    }

    maven {
        url = "https://api.modrinth.com/maven"
    }

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

configurations {
    shade
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Kotlin*
    implementation 'thedarkcolour:kotlinforforge:4.10.0'

    implementation(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // These `transitive = false` are all necessary. It doesn't work otherwise.
    // Note one of them has `transitive = true`!
    shade minecraftLibrary("org.ejml:ejml-core:0.44.0") {
        transitive = false
    }

    shade minecraftLibrary("org.ejml:ejml-simple:0.44.0") {
        transitive = false
    }

    shade minecraftLibrary("org.ejml:ejml-fdense:0.44.0") {
        transitive = false
    }

    shade minecraftLibrary("org.ejml:ejml-ddense:0.44.0") {
        transitive = true // Necessary, or it doesn't work (?)
    }

    shade minecraftLibrary("org.ejml:ejml-cdense:0.44.0") {
        transitive = false
    }

    shade minecraftLibrary("org.ejml:ejml-zdense:0.44.0") {
        transitive = false
    }

    shade minecraftLibrary("org.ejml:ejml-dsparse:0.44.0") {
        transitive = false
    }

    shade minecraftLibrary("org.apache.commons:commons-math3:3.6.1")

    implementation fg.deobf("curse.maven:jade-324717:4801177")

    implementation fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    jarJar("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}") {
        jarJar.ranged(it, "[1.0,2.0)")
    }

    implementation fg.deobf("maven.modrinth:embeddium:${embeddium_version}")

    runtimeOnly fg.deobf("curse.maven:mekanism-268560:4866575")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

test {
    useJUnitPlatform()
}

configurations.shade {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-reflect'
    exclude group: 'org.jetbrains', module: 'annotations'

    exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-core'
    exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-json'
}

// Maybe not necessary (?)
configurations.all {
    resolutionStrategy {
        force "org.ejml:ejml-core:0.44.0"
        force "org.ejml:ejml-simple:0.44.0"
        force "org.ejml:ejml-fdense:0.44.0"
        force "org.ejml:ejml-ddense:0.44.0"
        force "org.ejml:ejml-cdense:0.44.0"
        force "org.ejml:ejml-zdense:0.44.0"
        force "org.ejml:ejml-dsparse:0.44.0"
    }
}

jar {
    archiveClassifier = 'slim'

    from(sourceSets.main.output) {
        include "eln2.refmap.json"
    }

    manifest {
        attributes([
            "MixinConfigs": "eln2.mixins.json"
        ])
    }
}

reobf.create("shadowJar")

shadowJar {
    archiveClassifier = 'full'
    configurations = [project.configurations.shade]

    def domain = "${project.group}.shaded"

    relocate "org.snakeyaml.engine", "${domain}.snakeyaml.engine"
    relocate "pabeles.concurrency", "${domain}.pabeles.concurrency"
    relocate "org.ejml", "${domain}.ejml"
    relocate "org.apache.commons.math3", "${domain}.apache.commons.math3"

    finalizedBy("reobfShadowJar")
}

shadowJar.doLast {
    def shadowFile = archiveFile.get().asFile
    def jarJarFile = tasks.jarJar.archiveFile.get().asFile

    ant.jar(destfile: shadowFile, update: true) {
        zipfileset(src: jarJarFile, includes: "META-INF/jarjar/**")
    }

    def jarJarZip = new java.util.zip.ZipFile(jarJarFile)
    def metadataEntry = jarJarZip.getEntry("META-INF/jarjar/metadata.json")
    def originalMetadata = jarJarZip.getInputStream(metadataEntry).text
    jarJarZip.close()

    def patchedMetadata = originalMetadata.replace('"isObfuscated": false', '"isObfuscated": true')

    def metadataFile = new File(temporaryDir, "metadata.json")
    metadataFile.text = patchedMetadata

    ant.jar(destfile: shadowFile, update: true) {
        zipfileset(dir: temporaryDir, includes: "metadata.json", prefix: "META-INF/jarjar")
    }
}
shadowJar.dependsOn tasks.reobfJarJar

mixin {
    add sourceSets.main, "eln2.refmap.json"

    config "eln2.mixins.json"
    config "eln2.mixins.sodium.json"
    config "eln2.mixins.flywheel.json"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1', // We are version 1 of ourselves
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

afterEvaluate {
    tasks.configureReobfTaskForReobfJar.mustRunAfter(tasks.compileJava)
    tasks.configureReobfTaskForReobfJarJar.mustRunAfter(tasks.compileJava)
}

compileJava {
    options.compilerArgs += [
        "-Aout.refMapFile=eln2.refmap.json"
    ]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

artifacts {
    archives shadowJar
}
